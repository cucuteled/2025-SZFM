<script>
// DROPDOWN ---------------------------------------------------------------------

const scheduleCheck = document.getElementById("scheduleCheck");
const scheduleOptions = document.getElementById("scheduleOptions");

const monthSelect = document.getElementById("monthSelect");
const daySelect = document.getElementById("daySelect");
const hourSelect = document.getElementById("hourSelect");
const minuteSelect = document.getElementById("minuteSelect");

// Megjelenítés / elrejtés
scheduleCheck.addEventListener("change", () => {
  scheduleOptions.style.display = scheduleCheck.checked ? "block" : "none";
  if (scheduleCheck.checked) {
    fillAllDropdowns();
  }
});

function fillAllDropdowns() {
  const now = new Date();

  fillMonthDropdown(now);
  fillDayDropdown(now);
  fillHourDropdown(now);
  fillMinuteDropdown(now);
}

function fillMonthDropdown(now) {
  monthSelect.innerHTML = "";
  const thisMonth = now.getMonth(); // 0-11
  const nextMonth = (thisMonth + 1) % 12;

  // csak 2 hónap: aktuális + következő
  addOption(monthSelect, thisMonth, getMonthName(thisMonth));
  addOption(monthSelect, nextMonth, getMonthName(nextMonth));
}

function fillDayDropdown(now) {
  daySelect.innerHTML = "";

  const selectedMonth = Number(monthSelect.value);
  const todayMonth = now.getMonth();

  let startDay;
  let lastDay = new Date(now.getFullYear(), selectedMonth + 1, 0).getDate();

  if (selectedMonth === todayMonth) {
    startDay = now.getDate(); // pl. 20-a után csak 20–31
  } else {
    startDay = 1; // következő hónap: 1-től 20 nap múlva
  }

  // max 20 nap előre
  const maxDay = Math.min(startDay + 20, lastDay);

  for (let d = startDay; d <= maxDay; d++) {
    addOption(daySelect, d, d);
  }
}

function fillHourDropdown(now) {
  hourSelect.innerHTML = "";

  const selectedDay = Number(daySelect.value);
  const todayDay = now.getDate();

  let startHour = 0;

  if (selectedDay === todayDay) {
    startHour = now.getHours();
  }

  for (let h = startHour; h < 24; h++) {
    addOption(hourSelect, h, h.toString().padStart(2, "0"));
  }
}

function fillMinuteDropdown(now) {
  minuteSelect.innerHTML = "";

  const selectedDay = Number(daySelect.value);
  const selectedHour = Number(hourSelect.value);
  const todayDay = now.getDate();
  const currentHour = now.getHours();

  let startMin = 0;

  if (selectedDay === todayDay && selectedHour === currentHour) {
    startMin = now.getMinutes();
  }

  for (let m = startMin; m < 60; m += 1) {
    addOption(minuteSelect, m, m.toString().padStart(2, "0"));
  }
}

function addOption(select, value, text) {
  const o = document.createElement("option");
  o.value = value;
  o.textContent = text;
  select.appendChild(o);
}

function getMonthName(m) {
  const hu = [
    "Január","Február","Március","Április","Május","Június",
    "Július","Augusztus","Szeptember","Október","November","December"
  ];
  return hu[m];
}

// ha a hónap vagy nap változik, töltsd újra a következő dropdownokat
monthSelect?.addEventListener("change", () => {
  fillDayDropdown(new Date());
  fillHourDropdown(new Date());
  fillMinuteDropdown(new Date());
});

daySelect?.addEventListener("change", () => {
  fillHourDropdown(new Date());
  fillMinuteDropdown(new Date());
});

hourSelect?.addEventListener("change", () => {
  fillMinuteDropdown(new Date());
});

// DROPDOWN VÉGE----------------------------------------------------
let validate;
loadInfos();
async function loadInfos() {
    const firstname = document.getElementById("userfirstname");
  const secondname = document.getElementById("usersecondname");
  const address = document.getElementById("useraddress");
  const addressEquals = document.getElementById("useraddressequals");
  const billingAddress = document.getElementById("userbillingaddress");
  const phone = document.getElementById("userphonenumber");
  const orderButton = document.getElementById("paymentmethod"); // orderbutton originally
  
  try {
    const res = await fetch(`/api/v1/cart/myUserCartInfo`, {
      method: 'GET',
      credentials: 'same-origin'
    });

    if (!res.ok) throw new Error('Adatok lekérése sikertelen!');
    const data = await res.json();
    
    firstname.value = data.firstName;
    secondname.value = data.lastName;
    
    if (data.shippingAddress !== data.billingAddress) {
      addressEquals.checked = false;
      address.value = data.shippingAddress;
      billingAddress.value = data.billingAddress;
    } else {
      address.value = data.shippingAddress;
      billingAddress.value = data.shippingAddress;
    }
    
    phone.value = data.phoneNumber;

    if (typeof validate === "function") validate();
  } catch (e) {
    console.log(e);
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const firstname = document.getElementById("userfirstname");
  const secondname = document.getElementById("usersecondname");
  const address = document.getElementById("useraddress");
  const addressEquals = document.getElementById("useraddressequals");
  const billingAddress = document.getElementById("userbillingaddress");
  const phone = document.getElementById("userphonenumber");
  const paybox = document.getElementById("paymentmethod"); // originally orderbutton

  // kezdetben rejtve
  paybox.style.display = "none";

  validate = () => {
    const isNotEmpty = (val) => val.trim().length > 0;

    const isPhoneValid = (val) => {
      // csak számok, legalább 7 számjegy
      return /^\d{7,}$/.test(val.trim());
    };

    const isFirstnameValid = isNotEmpty(firstname.value);
    const isSecondnameValid = isNotEmpty(secondname.value);
    const isAddressValid = isNotEmpty(address.value);
    const isPhoneValidResult = isPhoneValid(phone.value);

    let isBillingValid = true;
    if (!addressEquals.checked) {
      isBillingValid = isNotEmpty(billingAddress.value);
    }

    const isFormValid = isFirstnameValid &&
                        isSecondnameValid &&
                        isAddressValid &&
                        isBillingValid &&
                        isPhoneValidResult;

    paybox.style.display = isFormValid ? "block" : "none";
  };

  // mezők figyelése
  const inputsToWatch = [firstname, secondname, address, billingAddress, phone, addressEquals];
  inputsToWatch.forEach(input => {
    input.addEventListener("input", validate);
    input.addEventListener("change", validate); // checkbox esetén is fontos
  });
});

async function getcupons(total) {
    try {
        const res = await fetch(`/api/v1/cart/getcupons?total=${total}`, // kupons lista első eleme a szállítási díj!
        {
            method: 'GET',
            credentials: 'same-origin'
        }
        );
        
        if (!res.ok) throw new Error('Kuponok ellenőrzése sikertelen!');
        const cupons = await res.json();
        const feeLine = document.getElementById("feeslabel");
        const final = document.getElementById("finalLabel");
        let feeString = "";
        // lekértük a kuponokat és megjelenítjük
        for (const cupon of cupons) {
            if (cupon.id == -1) { 
                feeString = "Szállítási díj: " + cupon.osszeg.toString() + " Ft<i>"; 
                total += cupon.osszeg;
            } else
            {
                if ((total - cupon.osszeg) >= 0) {
                    feeString += "<i><br>" + cupon.code + ":</i> -" + cupon.osszeg.toString() + " Ft";
                    total = total - cupon.osszeg;
                } else {
                    var remaning = total + (total - cupon.osszeg) // az utolsó kuponból hány Forintot használunk fel!
                    feeString += "<i><br>" + cupon.code + ":</i> " + cupon.osszeg.toString() + "(-" + remaning.toString() + ") Ft";
                    total = 0;
                }
            }
            final.innerHTML = `Végösszeg: ${total} Ft`;
            feeLine.innerHTML = feeString + "</i>";
        }
        
    } catch (err) {} // hibakezelés
}

}

async function order() {
    let scheduledDate;
    // tervezet idő
    if (document.getElementById("scheduleCheck").checked) {
        const month = document.getElementById("monthSelect").value;
        const day = document.getElementById("daySelect").value;
        const hour = document.getElementById("hourSelect").value;
        const minute = document.getElementById("minuteSelect").value;
        
        const year = new Date().getFullYear();
        scheduledDate = new Date(
            year,
            month,  // mivel JS-ben 0-alapú a hónap
            day,
            hour,
            minute,
            0,          // másodperc
            0           // milliszekundum
        );

    } else {
        scheduledDate = new Date();
    }
    
    //console.log("Ütemezett dátum:", scheduledDate.toString());

    const paymentOptions = document.querySelectorAll('input[name="drone"]');
    const selectedPayment = Array.from(paymentOptions).find(r => r.checked)?.value;

    const orderfirstname = document.getElementById("userfirstname").value.trim();
    const ordersecondname = document.getElementById("usersecondname").value.trim();
    const address = document.getElementById("useraddress").value.trim();
    const addressEquals = document.getElementById("useraddressequals").checked;
    const billingAddress = document.getElementById("userbillingaddress").value.trim();
    const phone = document.getElementById("userphonenumber").value.trim();
    
    const updateUserInfo = document.getElementById("updateuserinfo").checked;
    
    // updateUserInfo on ask
    
    // Ha a szállítási és számlázási cím megegyezik, akkor a billingAddress a cím lesz
    const finalBillingAddress = addressEquals ? address : billingAddress;
    
    const dataToSend = {
      orderfirstname,
      ordersecondname,
      address,
      billingAddress: finalBillingAddress,
      phone,
      updateUserInfo,
      selectedPayment,
      scheduledDate,
    };
    
    const res = await fetch('/api/v1/cart/order', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(dataToSend),
    });

    //const json = await res.json();
  const box = document.getElementById("orderbox");

    function toggleBox(id) {
    const body = document.getElementById(id);
    const arrow = document.getElementById(id + '-arrow');
    const parentBox = body.parentElement;
    const htmlBody = document.body;

    if (body.classList.contains('hidden')) {
      body.classList.remove('hidden');
      arrow.textContent = '▼';
      parentBox.style.padding = '30px';
      //htmlBody.style.alignItems = 'center';
    } else {
      body.classList.add('hidden');
      arrow.textContent = '▲';
      parentBox.style.padding = '10px';
      //htmlBody.style.alignItems = '';
    }
  }
